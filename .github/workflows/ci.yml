name: CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/runner-selector.yml

  test:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner-label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Public safety scan
        run: python scripts/check_public_safety.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run flake8
        run: flake8 cleanarr apps tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Update job summary
        if: always()
        env:
          JOB_TITLE: ${{ job.name || github.job }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash .github/scripts/write_job_summary.sh

  docker-build:
    needs: runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cleanarr-cronjob
            file: apps/job/Dockerfile
          - image: cleanarr-webhook-app
            file: apps/webhook/Dockerfile
          - image: cleanarr-lambda
            file: apps/lambda/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Detect ECR Public credentials
        id: ecr-public-config
        env:
          AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          if [ -n "${AWS_OIDC_ROLE_ARN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi
      # Authenticated ECR Public pulls get 10/sec vs 1/sec anonymous (see
      # https://docs.aws.amazon.com/AmazonECR/latest/public/public-service-quotas.html).
      # ECR Public auth is only served from us-east-1. Skipped when secrets
      # are unavailable (e.g. fork PRs); base images are digest-pinned anyway.
      - name: Configure AWS credentials for ECR Public
        if: ${{ steps.ecr-public-config.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to ECR Public
        if: ${{ steps.ecr-public-config.outputs.enabled == 'true' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: public
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # NOTE: do not point this at public.ecr.aws — its anonymous
          # quotas throttle shared GitHub runners ("toomanyrequests: Data
          # limit exceeded"), failing CI before any image layer builds.
          # mirror.gcr.io is the same Docker Hub mirror the Dockerfiles
          # already pull base images from successfully.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mirror ECR Public base images to GHCR
        id: base-images
        if: ${{ matrix.file != 'apps/job/Dockerfile' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mirror="ghcr.io/${OWNER}/base-mirror"
          case "${{ matrix.file }}" in
            apps/webhook/Dockerfile)
              # Pre-mirrored by mirror-base-images.yml (source: public.ecr.aws/awsguru/aws-lambda-adapter:0.9.0@sha256:1c31bf4102ca63ef2082534d7139c0bc5fbd36ea6648e4756e9b475ef3ed829c)
              ref="ghcr.io/josh-archer/cleanarr-base-mirror/aws-lambda-adapter:0.9.0@sha256:1c31bf4102ca63ef2082534d7139c0bc5fbd36ea6648e4756e9b475ef3ed829c"
              echo "build-args=LAMBDA_ADAPTER_IMAGE=${ref}" >> "${GITHUB_OUTPUT}"
              ;;
            apps/lambda/Dockerfile)
              ref="$(bash scripts/mirror_base_image.sh public.ecr.aws/lambda/python:3.11@sha256:af7d68f0baca0969f5232b1adce5288b5132c711e4c9f6f899c8108d17012989 "${mirror}/lambda-python")"
              echo "build-args=LAMBDA_BASE_IMAGE=${ref}" >> "${GITHUB_OUTPUT}"
              ;;
          esac
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          build-args: ${{ steps.base-images.outputs.build-args }}
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
