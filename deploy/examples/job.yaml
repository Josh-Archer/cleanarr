apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanarr-job
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: cleanarr-job
            image: ghcr.io/example/cleanarr-cronjob:v0.2.3
            imagePullPolicy: IfNotPresent
            envFrom:
            - secretRef:
                name: cleanarr-secrets
            - configMapRef:
                name: cleanarr-config
            # Optional configMap keys: CLEANARR_GRACE_DAYS=0,
            # CLEANARR_LEAVING_SOON_COLLECTION=Leaving Soon, and
            # CLEANARR_LEAVING_SOON_STATE_FILE=/logs/leaving-soon-state.json.
            # Share a persistent state volume with the webhook deployment before
            # enabling a non-zero grace period.
            volumeMounts:
            - name: logs
              mountPath: /logs
          volumes:
          - name: logs
            emptyDir: {}
